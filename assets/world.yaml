# The main map: a 2^20 x 2^19 tile torus. The seed is fixed: every player
# gets the same world.
seed: 20261101
width: 1048576
height: 524288
generator: earth     # oceans, coasts and grassland (internal/gen/earth.go)
# Tilesets always loaded: those the generator and the game use directly
# (maps load theirs automatically).
tilesets:
  - tilesets/tinytown.tsj
  - tilesets/tinybattle.tsj
  - tilesets/water.tsj    # animated water, generated from Tiny Battle (tools: see ARCHITECTURE.md)
  - tilesets/worlds.tsj   # the project's own tiles: bicycle, scooter, lamp post
  - tilesets/rpgurban.tsj # Kenney RPG Urban Pack: streets, buildings, vehicles (towns and cities)
# Hand-made patches placed on the main map. Open this file in Tiled to edit
# the patches in context. The town straddles the east-west wrap seam.
patches: maps/patches/main.world
# Detail-map templates: interiors, caves, later vehicle interiors.
details: maps/detail
# Pool patches: hand-made pieces (small islands) the world places by itself,
# at most one per 512x512 area, where the generator finds open sea.
pool: maps/pool
# Where a new game starts (a spawn on the main map).
start: start
