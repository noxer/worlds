# The quests (package quest): each begins when its start conditions hold
# and moves on stage by stage as the stages' conditions come to hold. The
# conditions and effects are those of dialogs (package story). Progress is
# kept as flags: quest.<id>, quest.<id>.<stage>, quest.<id>.done.

- id: meadow_slimes
  name: Slimes in the meadow
  start: [flag slime_job]
  stages:
    - id: clear
      text: Clear the slimes and the wisp out of the east field of Willow Meadow.
      done: [flag defeated.slime_1, flag defeated.slime_2, flag defeated.wisp_1]
    - id: report
      text: Tell Elder Maren the field is clear.
      done: [flag slime_job_done]
  effects: [give coin 10]

- id: hilde_delivery
  name: Hilde's delivery
  start: [flag hilde_job]
  stages:
    - id: bandits
      text: Search the old cellar under Willow Meadow (the hatch in its north-west corner) for whoever took Hilde's crate.
      done: [flag defeated.bandit_1, flag defeated.bandit_2, flag defeated.bandit_3]
    - id: crate
      text: The bandits are beaten. Find Hilde's crate in the cellar's back room.
      done: [item crate]
    - id: back
      text: Bring the crate back to Hilde at her forge.
      done: [flag crate_back]
  effects: [give coin 20]
