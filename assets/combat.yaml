# The rules of fights (package combat): abilities, and the numbers of
# everyone who can fight, by kind: a party member's name, or the "enemy"
# property of an NPC on a map.
#
# ap: action points an ability costs; range: nearest and farthest target in
# steps; sight: needs a line of sight; damage: least and most; push: tiles
# the target is moved straight away (the damage then only counts if it
# can't move).
abilities:
  strike: {name: Strike, ap: 2, range: [1, 1], damage: [3, 5]}
  shot:   {name: Shot, ap: 2, range: [2, 6], sight: true, damage: [2, 4]}
  shove:  {name: Shove, ap: 1, range: [1, 1], push: 1, damage: [2, 2]}

# hp: health; move: tiles per turn; ap: action points per turn; init:
# initiative (higher goes first).
combatants:
  Ari:   {hp: 14, move: 4, ap: 3, init: 6, abilities: [strike, shove]}
  Bryn:  {hp: 10, move: 4, ap: 3, init: 7, abilities: [shot, shove]}
  Cato:  {hp: 12, move: 5, ap: 3, init: 5, abilities: [strike, shove]}
  Dagny: {hp: 16, move: 3, ap: 3, init: 3, abilities: [strike, shove]}
  slime: {hp: 8, move: 3, ap: 2, init: 2, abilities: [strike]}
  wisp:  {hp: 6, move: 4, ap: 2, init: 8, abilities: [shot]}

default: {hp: 10, move: 4, ap: 3, init: 4, abilities: [strike, shove]}
