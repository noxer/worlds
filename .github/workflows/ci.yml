name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Ebitengine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev libgl1-mesa-dev libxxf86vm-dev libasound2-dev
      - run: go vet ./...
      - run: go test ./...
      - name: Race detector (chunk streaming)
        run: go test -race ./internal/world/ ./internal/gen/ ./internal/scene/
      - run: go build ./cmd/worlds
      - run: make web
